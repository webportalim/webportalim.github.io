<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webportalim</title>
  <meta name="description" content="Webportalim GitHub Pages">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #070b12;
      color: #eef4ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 32px; }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 8vw, 6rem); letter-spacing: -0.05em; }
    p { margin: 0; color: #8fa3bf; font-size: 1.05rem; }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 8px;
      border-radius: 50%;
      background: #5cff9d;
      box-shadow: 0 0 20px #5cff9d;
    }
  </style>
</head>
<body>
  <main>
    <h1>webportalim.github.io</h1>
    <p><span class="dot"></span>GitHub Pages test page</p>
  </main>
</body>
</html>
