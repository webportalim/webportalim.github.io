name: Update Fab products

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_fab_products.mjs"
      - ".github/workflows/update-fab-products.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Discover and refresh Fab products
        run: node scripts/update_fab_products.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- fab-products.json; then
            echo "No Fab changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fab-products.json
          git commit -m "Refresh Fab products"
          git push
